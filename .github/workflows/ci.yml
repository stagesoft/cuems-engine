name: CI

on:
  push:
    branches: [main, rc_1]
  pull_request:
    branches: [main, rc_1]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-interaction

      - name: black
        run: poetry run black --check src/ tests/

      - name: isort
        run: poetry run isort --check src/ tests/

      - name: flake8
        run: poetry run flake8 src/ # PEP8 compliance for shipped code

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Debian 12 is the production OS: its python3 is the 3.11 the engine
    # targets, and the pyossia wheel / libmtcmaster / librtpmidid builds are
    # made for it. The job runs as root inside the container (no sudo).
    container: debian:bookworm
    needs: lint
    permissions:
      contents: write   # required to push the coverage badge to gh-pages
    env:
      DEBIAN_FRONTEND: noninteractive
      POETRY_VIRTUALENVS_IN_PROJECT: "true"

    steps:
      # Before checkout: without git, actions/checkout falls back to a
      # tarball, and the badge deploy needs git + rsync. The slim image also
      # lacks tools the engine shells out to: ss (iproute2, PortHandler port
      # scan) and pgrep (procps, PlayerHandler orphan detection).
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git rsync wget zstd \
            python3 python3-dev python3-venv pipx \
            iproute2 procps \
            libjack-jackd2-dev \
            libsystemd-dev \
            gcc \
            pkg-config \
            libavahi-client-dev \
            librtmidi6

      - uses: actions/checkout@v4

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install CUEMS native libraries
        run: |
          # pyossia is not installed here: it comes from the wheel pinned in
          # pyproject.toml's dev group (same libossia release as the .deb).
          wget -q https://github.com/stagesoft/libmtcmaster/releases/download/v0.0.2-0/libmtcmaster_0.0.2-0_amd64.deb -O /tmp/libmtcmaster.deb
          wget -q https://github.com/stagesoft/rtpmidid/releases/download/v26.06-1stagelab1/librtpmidid0_26.01.1.g7f552_amd64.deb -O /tmp/librtpmidid0.deb
          apt-get install -y --no-install-recommends /tmp/librtpmidid0.deb
          # libmtcmaster Depends on cuems-utils, which is not a Debian package
          # (the engine gets it from PyPI), so it cannot be apt-installed.
          # Its real library dependency, librtmidi6, is installed above;
          # without it every test that imports cuemsengine errors on
          # "libmtcmaster import error: librtmidi.so.6" and CI runs 0 tests.
          dpkg --force-depends --unpack /tmp/libmtcmaster.deb

      # Pinned: the lock file is written by this Poetry version.
      - name: Install Poetry
        run: |
          pipx install poetry==2.4.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Poetry for Python 3.11
        run: poetry env use python3

      # The key carries the venv layout: venvs cached under the old
      # ubuntu/deadsnakes keys were built for another OS and must not be
      # restored into this one.
      - name: Load cached virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-bookworm-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-interaction

      - name: Install Python 3.11 systemd bindings
        run: poetry run pip install systemd-python==235

      - name: Unit tests
        run: |
          poetry run pytest \
            -m "not integration" \
            -n auto \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=45

      - name: Integration fast tests
        run: |
          poetry run pytest \
            -m "integration and not slow" \
            --cov=src \
            --cov-append \
            --cov-report=term-missing

      # No "Integration slow tests" step: the only two tests currently
      # marked @pytest.mark.slow (test_cpu_usage.py, test_project_go.py) are
      # both unreliable on a CI runner and are run manually/locally instead.
      # See specs/planning/integration-slow-tests-investigation.md.

      - name: Generate XML coverage report
        run: poetry run coverage xml -o coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml

      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: |
          mkdir -p _badge
          pipx run --spec "genbadge[coverage]" genbadge coverage -i coverage.xml -o _badge/coverage.svg

      - name: Deploy coverage badge to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _badge
          target-folder: badges
          clean: false
