name: CI

on:
  push:
    branches: [main, rc_1]
  pull_request:
    branches: [main, rc_1]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          # The full interpreter version is in the key: a cached venv's bin/python links to the
          # absolute path of the Python it was made with, so a new patch release (3.11.17 -> 3.11.18)
          # leaves a restored venv broken; poetry then recreates an empty one and lint finds no black.
          key: venv-v2-dev-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        # Always, not only on a cache miss: seconds on a good cache, and it repairs a stale or partial one.
        run: poetry sync --with dev --no-interaction

      - name: black
        run: poetry run black --check src/ tests/

      - name: isort
        run: poetry run isort --check src/ tests/

      - name: flake8
        run: poetry run flake8 src/ # PEP8 compliance for shipped code

  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: lint
    permissions:
      contents: write   # required to push the coverage badge to gh-pages

    steps:
      - uses: actions/checkout@v4

      # Python 3.11 from GitHub's tool cache, as in the lint job. It used to come from the deadsnakes PPA, whose
      # Launchpad server failed the job on 2026-11-11 (hung 15 min) and 2026-11-17 (503 on the .debs).
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjack-jackd2-dev \
            libsystemd-dev \
            gcc \
            pkg-config \
            libavahi-client-dev \
            librtmidi6 \
            ffmpeg \
            wget
          wget https://github.com/stagesoft/libossia/releases/download/v2.0.0rc6/python3-pyossia_2.0.0-rc6+124+cuems2_amd64.deb -O python3-pyossia.deb
          wget https://github.com/stagesoft/libmtcmaster/releases/download/v0.0.2-0/libmtcmaster_0.0.2-0_amd64.deb -O libmtcmaster.deb
          wget https://github.com/stagesoft/rtpmidid/releases/download/v26.06-1stagelab1/librtpmidid0_26.01.1.g7f552_amd64.deb -O librtpmidid0.deb
          # jammy's python3 metapackage is 3.10; pyossia requires >= 3.11.
          # --unpack skips postinst (py3compile needs a registered python3 >= 3.11).
          sudo dpkg --force-depends --unpack "$(realpath python3-pyossia.deb)"
          # --force-depends skips libmtcmaster's own Depends, so librtmidi6
          # (librtmidi.so.6, jammy universe 5.0.0-2) is installed above; without
          # it every test that imports cuemsengine errored on
          # "libmtcmaster import error: librtmidi.so.6" and CI ran 0 tests.
          sudo dpkg --force-depends --unpack "$(realpath libmtcmaster.deb)"
          sudo dpkg --force-depends --unpack "$(realpath librtpmidid0.deb)"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Configure Poetry for Python 3.11
        run: poetry env use "${{ steps.setup-python.outputs.python-path }}"

      - name: Load cached virtualenv
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          # Full interpreter version in the key (see the lint job).
          key: venv-v2-dev-${{ runner.os }}-systemd-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        # Always: repairs a stale or partial cached venv (see the lint job).
        run: poetry sync --with dev --no-interaction

      - name: Let the venv see the modules the .debs installed
        # pyossia, libmtcmaster and librtpmidid come as .debs into the system's dist-packages. The deadsnakes
        # interpreter had those directories on its path and the venv used system-site-packages; this interpreter
        # does not, so a .pth adds them AFTER the venv's own site-packages (nothing in the venv is shadowed).
        # Directories that do not exist are skipped by site.
        run: |
          site=$(poetry run python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          printf '%s\n' /usr/lib/python3/dist-packages /usr/lib/python3.11/dist-packages > "$site/cuems-system-dist-packages.pth"
          poetry run python -c 'import pyossia; print("pyossia from", pyossia.__file__)'

      - name: Install Python 3.11 systemd bindings
        run: poetry run pip install systemd-python==235

      - name: Unit tests
        run: |
          poetry run pytest \
            -m "not integration" \
            -n auto \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=45

      - name: Integration fast tests
        run: |
          poetry run pytest \
            -m "integration and not slow" \
            --cov=src \
            --cov-append \
            --cov-report=term-missing

      # No "Integration slow tests" step: the only two tests currently
      # marked @pytest.mark.slow (test_cpu_usage.py, test_project_go.py) are
      # both unreliable on a CI runner and are run manually/locally instead.
      # See specs/planning/integration-slow-tests-investigation.md.

      - name: Generate XML coverage report
        run: poetry run coverage xml -o coverage.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml

      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: |
          pip install "genbadge[coverage]"
          mkdir -p _badge
          genbadge coverage -i coverage.xml -o _badge/coverage.svg

      - name: Deploy coverage badge to GitHub Pages
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _badge
          target-folder: badges
          clean: false
