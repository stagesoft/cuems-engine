#
# Installed by cuems-engine-mock. Runs the mock nodeconf instead of the real
# daemon: it answers the engine's node adoption requests (UI adopt/unadopt)
# on /tmp/nodeconf.ipc by flipping <adopted> in network_map.xml, with no
# avahi discovery, so the nodes a mock box lists are never rewritten from the
# network. A local override.conf (systemctl edit) sorts after this file and
# still wins.
[Service]
Type=simple
RemainAfterExit=no
ExecStart=
ExecStart=/usr/lib/cuems/bin/python3 -m cuemsengine.scripts.mock_nodeconf
Restart=on-failure
RestartSec=5
TimeoutSec=30
